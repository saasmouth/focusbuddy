name: Build Windows installer

# Why this exists: better-sqlite3 ships a native binding that is compiled
# per-OS against Electron's ABI. You cannot cross-build the Windows binding
# from a Mac, so the Windows NSIS installer has to be produced on a Windows
# runner. This workflow does that — rebuild the native module for Electron,
# package with electron-builder, and (on a tag) publish to the same GitHub
# Releases channel macOS already uses, so electron-updater drives auto-update
# on both platforms from one place.

on:
  # Manual run from the Actions tab (or `gh workflow run`). Dispatching against a
  # BRANCH builds the installer and leaves it as a run artifact; dispatching
  # against a TAG also publishes it to that tag's GitHub Release, which is how a
  # release gets its Windows half.
  #
  # This stays the only trigger on purpose: a `push: tags` trigger that
  # auto-published collided with the hand-uploaded release assets and failed on
  # every tag (v2.5.3–v2.5.5).
  workflow_dispatch:

jobs:
  build:
    # electron-builder's `--publish always` path POSTs to the Releases API, and
    # the default GITHUB_TOKEN is read-only, so without this the tag build dies
    # on "HttpError: 403 Forbidden ... Resource not accessible by integration"
    # after doing all twenty-odd minutes of work. That is what happened on
    # v4.3.1's first run, and it is very likely the real cause of the v2.5.3–
    # v2.5.5 publish failures the trigger comment above blames on collisions.
    # contents:write is the least this needs; nothing here wants more.
    permissions:
      contents: write
    # Pinned to windows-2022 on purpose: windows-latest moved to a runner image
    # with Visual Studio 18, which the node-gyp bundled with Electron 37 does not
    # recognise ("find VS unknown version undefined"), so the native-module
    # rebuild fails. windows-2022 ships VS 2022, which node-gyp supports.
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # node-mac-haptics is in optionalDependencies, so a failed build of that
      # macOS-only module does NOT fail the install on Windows.
      #
      # `npm install` (not `npm ci`): the lockfile is generated on macOS and the
      # @esbuild/@rollup platform-binary set can drift between Node/npm versions,
      # which makes the stricter `npm ci` refuse to run. `npm install` reconciles
      # instead of failing, which is what we want for a build runner.
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      # Set up the MSVC build environment explicitly. On Electron 37, node-gyp's
      # auto-detection of Visual Studio crashes on the runner with
      # ERR_CHILD_PROCESS_STDIO_MAXBUFFER ("Could not find any Visual Studio
      # installation"), even though VS is present. Exposing the toolchain via
      # this action + pinning GYP_MSVS_VERSION lets node-gyp use it directly
      # instead of running the crashing probe.
      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1

      # npm built better-sqlite3 against system Node's ABI; rebuild it against
      # Electron's ABI (electron-builder runs with npmRebuild:false).
      - name: Rebuild native modules for Electron
        run: npm run rebuild:win
        env:
          GYP_MSVS_VERSION: '2022'

      - name: Typecheck
        run: npm run typecheck

      # Bake the live backend into the renderer, exactly like the local macOS
      # build does. Without these the build falls back to signalConfig's default
      # host, so the Windows app could not reach the server at all (signup,
      # login, sharing, and plan checks all failed with "can't connect").
      - name: Build renderer + main
        env:
          VITE_USE_REMOTE_SIGNAL: 'true'
          VITE_SIGNAL_HTTP_URL: 'https://focusbuddy-signal.fly.dev'
          VITE_SIGNAL_WS_URL: 'wss://focusbuddy-signal.fly.dev/ws'
          VITE_VIEWER_URL: 'https://focusbuddy-viewer.vercel.app'
        run: npm run build

      # Publish only on a tag push; manual runs stay unpublished. Code signing
      # happens automatically when CSC_LINK + CSC_KEY_PASSWORD secrets are set
      # (CSC_LINK = a base64-encoded .pfx or a path; CSC_KEY_PASSWORD = its
      # password). With no cert configured the installer is built unsigned.
      - name: Package Windows installer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            npx electron-builder --win --publish always
          else
            npx electron-builder --win --publish never
          fi

      # always(): if the publish step fails, the installer itself is usually
      # fine — it is the upload to GitHub that broke. Without this the artifact
      # step is skipped on failure and twenty minutes of Windows build output is
      # thrown away, leaving nothing to attach by hand either.
      - name: Upload installer artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: haptyx-windows-installer
          path: |
            release/*.exe
            release/latest.yml
          if-no-files-found: error
