name: CI

# Every change gets static checks, unit coverage, a secret scan, and a focused
# Electron smoke suite covering security, accessibility, launch and sync.

on:
  push:
  pull_request:
  workflow_dispatch:

# One run per ref; a new push cancels the previous run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  typecheck-and-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # node:sqlite (the unit suite's test DB) needs Node >= 22.5 — on 20 every
          # sqlite-based test dies with 'No such built-in module: node:sqlite',
          # which is why CI has been red on main too.
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Secret scan
        run: npm run check:secrets

      - name: Unit tests
        run: npm run test:unit
        env:
          CI: 'true'

  electron-smoke:
    needs: typecheck-and-unit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Electron security, accessibility and workflow smoke tests
        run: xvfb-run -a npm run test:e2e:smoke
        env:
          CI: 'true'

      - name: Bundle budget
        run: npm run check:bundle
