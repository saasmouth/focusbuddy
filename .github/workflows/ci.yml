name: CI

# Every change gets static checks, unit coverage, a secret scan, and a focused
# Electron smoke suite covering security, accessibility, launch and sync.

on:
  push:
  pull_request:
  workflow_dispatch:

# One run per ref; a new push cancels the previous run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  typecheck-and-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # node:sqlite (the unit suite's test DB) needs Node >= 22.5 — on 20 every
          # sqlite-based test dies with 'No such built-in module: node:sqlite',
          # which is why CI has been red on main too.
          node-version: 22
          cache: npm

      - run: npm ci
        # node-llama-cpp (on-device AI) ships prebuilt binaries; never let its
        # postinstall download or compile llama.cpp on a CI runner.
        env:
          NODE_LLAMA_CPP_SKIP_DOWNLOAD: 'true'

      - name: Typecheck
        run: npm run typecheck

      - name: Secret scan
        run: npm run check:secrets

      - name: Unit tests
        run: npm run test:unit
        env:
          CI: 'true'

      # The same suite in two fixed shuffled orders (seeds in the script). A
      # test that passes only after a particular other test is invisible to the
      # run above; seven were, at once. On a failure the log names the seed --
      # scripts/test-shuffle.mjs says how to reproduce it in one file.
      - name: Unit tests, shuffled order
        run: npm run test:shuffle
        env:
          CI: 'true'

      # The browser runtime, which plexiidesk.com's /share/ app is built from.
      # Nothing else here builds it, so a desktop-only import reaching it broke
      # the site's compose step for three integration tips before anyone saw.
      # tests/unit/webBundleGraph.test.ts names the import chain; this is the
      # real build behind it.
      - name: Web build
        run: npm run web:build

  electron-smoke:
    needs: typecheck-and-unit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
        # node-llama-cpp (on-device AI) ships prebuilt binaries; never let its
        # postinstall download or compile llama.cpp on a CI runner.
        env:
          NODE_LLAMA_CPP_SKIP_DOWNLOAD: 'true'

      - name: Electron security, accessibility and workflow smoke tests
        run: xvfb-run -a npm run test:e2e:smoke
        env:
          CI: 'true'

      - name: Bundle budget
        run: npm run check:bundle
