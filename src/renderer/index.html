<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- connect-src allows https + ws/wss for the deployed signal, plus plain http
         and ws to LOCALHOST only, so a local signal server (dev, or the 10-user
         test harness in tools/test-org) is reachable. Localhost-scoped, so prod
         connectivity (https://focusbuddy-signal.fly.dev) is unchanged and no
         non-local http origin is permitted. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: https: fb-file: fb-dev:; media-src 'self' fb-file: fb-dev: blob: data:; connect-src 'self' ws: wss: https: http://localhost:* http://127.0.0.1:* ws://localhost:* ws://127.0.0.1:*;" />
    <title>PlexiDesk</title>
    <!--
      Type stack (Inter, JetBrains Mono, Patrick Hand, Atkinson Hyperlegible,
      Lexend) and the Material Symbols icon font are now self-hosted and imported
      from src/main.tsx via the bundled `material-symbols` and `@fontsource`
      packages. They no longer load from the Google Fonts CDN, so icons and text
      render even with no network and the CSP no longer needs to allow fonts.google.
    -->
  </head>
  <body style="background-color: var(--surface-base)">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
