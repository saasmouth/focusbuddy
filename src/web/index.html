<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Plexii</title>
    <style>
      html, body, #root { height: 100%; margin: 0; background: #0f1115; }
      /* The gate is a fixed overlay, never part of the flow. As a block element
         it kept its full viewport height after emptying, which pushed #root
         exactly one screen down: the app rendered correctly and off the bottom
         of the window, looking for all the world like a blank canvas. */
      /* The gate layer: sign-in-style screens before the app, and the share
         countdown bar alongside it.

         It is full-viewport and it is NOT always empty, so it must not capture
         events. A share window keeps a 40px bar in here for the life of the
         session, and while :empty hid the layer for every other case, with the
         bar present this became an invisible sheet over the whole desk -- the
         canvas could not be panned, zoomed or clicked at all, because nothing
         reached it. pointer-events are handed back by the children, so a
         full-screen gate card still works and the bar still takes its clicks. */
      #boot { position: fixed; inset: 0; z-index: 100; pointer-events: none; }
      #boot > * { pointer-events: auto; }
      #boot:empty { display: none; }
      /* With the bar showing, the app starts below it rather than under it. */
      html.fb-share-bar #root { padding-top: 40px; box-sizing: border-box; height: 100%; }
    </style>
  </head>
  <body class="bg-desk-50">
    <!-- The renderer mounts into #root exactly as it does on the desktop; #boot
         holds the sign-in gate that runs before it and then gets out of the way. -->
    <div id="boot"></div>
    <div id="root"></div>
    <script type="module" src="/boot.tsx"></script>
  </body>
</html>
